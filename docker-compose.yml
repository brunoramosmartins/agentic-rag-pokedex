# Local services: Neo4j (the examiner) and Arize Phoenix (OTel traces).
# Copy .env.example to .env before the first `docker compose up`.

services:
  neo4j:
    image: neo4j:5-community
    container_name: pokedex-neo4j
    restart: unless-stopped
    ports:
      - "7474:7474"   # browser
      - "7687:7687"   # bolt
    environment:
      NEO4J_AUTH: "${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:?set NEO4J_PASSWORD in .env}"
      NEO4J_server_memory_heap_max__size: "1G"
      NEO4J_server_memory_pagecache_size: "512M"
    volumes:
      - neo4j-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  phoenix:
    image: arizephoenix/phoenix:latest
    container_name: pokedex-phoenix
    restart: unless-stopped
    ports:
      - "6006:6006"   # UI + OTLP over HTTP
      - "4317:4317"   # OTLP over gRPC
    environment:
      PHOENIX_WORKING_DIR: /mnt/data
    volumes:
      - phoenix-data:/mnt/data

volumes:
  neo4j-data:
  phoenix-data:
